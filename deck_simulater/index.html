<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>デッキシミュレータ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div data-include="../common/header.html"></div>

  <h2>デッキシミュレータ</h2>
  <span style="color: red; font-weight: bold;">LINEのブラウザではPDF出力できません。</span><br>
  PDF失敗時には枚数減らしてみてください。レンタルサーバで不安定なので時間おいたり枚数減らしたりしてみてください。<br>
  PCは「ctrl + P」できれいにPDFにできると思います(Chrome実証済み)。これが一番早いし安定します。
  <div class="controls">
    <input type="text" id="deckIdInput" placeholder="デッキIDを入力">
    <button id="outputBtn">出力</button>
    <button id="shuffleBtn">シャッフル</button>
    <button id="pdfBtn" disabled>PDF出力</button>
  </div>

  <div id="status" class="status">デッキIDを入力してください。</div>

  <div id="deck-area">
    <div class="section-block">
      <h2>手札</h2>
      <div id="handOutput" class="deck-output"></div>
    </div>
    <div class="section-block">
      <h2>ガーディアン</h2>
      <div id="guardianOutput" class="deck-output"></div>
    </div>
    <div class="section-block">
      <h2>山札</h2>
      <div id="deckOutput" class="deck-output"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="../common/include-html.js"></script>
  <script src="script.js?v=37b01fd"></script>
  <div data-include="../common/footer.html"></div>
</body>
</html>
